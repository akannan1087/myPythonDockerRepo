apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-python-app-deployment
  namespace: python-app-ns     # Namespace where the deployment will be created
spec:
  replicas: 3
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: my-python-app
        image: 211223789150.dkr.ecr.us-east-1.amazonaws.com/devopscoach/my-python-repo:${BUILD_NUMBER}
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
# service type loadbalancer       
---
apiVersion: v1
kind: Service
metadata:
  name: python-app-svc
  namespace: python-app-ns     # Namespace where the deployment will be created
spec:
  selector:
    app: python-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP

spec:
  containers:
  - name: kubectl-repo-container
    image: 136356824322.dkr.ecr.us-east-2.amazonaws.com/yohyoh/kubectl-repo:latest
    imagePullPolicy: Always # Forces K8s to pull the new 'latest' image every time
